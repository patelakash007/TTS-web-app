<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Reading Chronicle — Text to Speech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unna:wght@700&family=Quattrocento:wght@400;700&family=Sorts+Mill+Goudy:ital,wght@0,400;1,400&family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #F7F3E9;
    --primary:   #2C2C2C;
    --accent:    #A83E3E;
    --secondary: #6B6B6B;
    --positive:  #2E7D32;
    --surface:   rgba(255,255,255,0.7);
    --surface-strong: rgba(255,255,255,0.92);
  }
  html.dark{
    --bg:        #000000;
    --primary:   #EDE7D9;
    --accent:    #D9756B;
    --secondary: #9A9A9A;
    --positive:  #5FBF68;
    --surface:   rgba(255,255,255,0.04);
    --surface-strong: rgba(255,255,255,0.06);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    height: 100%;
    background: var(--bg);
    color: var(--primary);
    font-family: 'Quattrocento Sans', sans-serif;
    transition: background-color .25s ease, color .25s ease;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body{
    background-image:
      radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    height: 100dvh;
  }
  html.dark body{
    background-image:
      radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  .app{
    max-width: 720px;
    height: 100dvh;
    margin: 0 auto;
    padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Masthead ---------- */
  .masthead{
    text-align:center;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 6px double var(--primary);
    position: relative;
    flex-shrink: 0;
  }
  .masthead-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family: 'Quattrocento Sans', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--secondary);
    margin-bottom: 10px;
  }
  h1.title{
    font-family: 'Unna', serif;
    font-weight: 700;
    font-size: 2.1rem;
    letter-spacing: 0.5px;
    margin: 4px 0 6px;
    color: var(--primary);
  }
  .masthead .tagline{
    font-family: 'Sorts Mill Goudy', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--secondary);
    margin: 0;
  }

  #themeToggle{
    width: 38px; height: 38px;
    border: 2px solid var(--primary);
    border-radius: 0;
    background: var(--surface-strong);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color: var(--primary);
    box-shadow: 3px 3px 0 var(--secondary);
  }
  #themeToggle svg{ width:17px; height:17px; }
  #themeToggle:active{ transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--secondary); }

  /* ---------- Section titles ---------- */
  .section-title{
    font-family: 'Quattrocento', serif;
    font-weight: 700;
    color: var(--accent);
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
    margin: 0 0 14px;
  }

  /* ---------- Cards ---------- */
  .panel{
    background: var(--surface);
    border: 2px solid var(--primary);
    box-shadow: 3px 3px 0 var(--secondary);
    border-radius: 0;
    padding: 16px;
    margin-bottom: 14px;
  }

  #editorWrap.panel{
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  textarea#inputText{
    width:100%;
    flex: 1 1 auto;
    min-height: 0;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--primary);
    font-family: 'Sorts Mill Goudy', serif;
    font-style: italic;
    font-size: 1.08rem;
    line-height: 1.7;
    overflow-y: auto;
  }
  textarea#inputText::placeholder{ color: var(--secondary); opacity: 0.8; }

  .meta-row{
    display:flex;
    justify-content:flex-end;
    font-family: 'Quattrocento Sans', sans-serif;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.72rem;
    color: var(--secondary);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--secondary);
    flex-shrink: 0;
  }
  .meta-row #wordCount{ font-family:'Quattrocento', serif; font-weight:700; letter-spacing:0; color: var(--positive); }
  .meta-row.over #wordCount{ color: var(--accent); }

  /* ---------- Reader (chart box style) ---------- */
  #readerWrap.panel{
    padding: 0;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  html.dark #readerWrap.panel{ box-shadow: 5px 5px 0 rgba(255,255,255,0.06); }

  #readerText{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 22px 18px;
    font-family: 'Sorts Mill Goudy', serif;
    font-style: italic;
    font-size: 1.25rem;
    line-height: 2;
    white-space: pre-wrap;
    word-wrap: break-word;
    scroll-behavior: smooth;
  }
  .word{
    padding: 2px 3px;
    border-radius: 0;
    transition: background-color .12s ease, color .12s ease;
  }
  .word.active{
    background: var(--accent);
    color: var(--bg);
  }

  .hidden{ display:none !important; }

  /* ---------- Control table ---------- */
  .panel.controls{
    flex-shrink: 0;
    margin-bottom: 0;
  }

  .control-table{
    width:100%;
    border-collapse: collapse;
    margin-bottom: 4px;
  }
  .control-table tr{ }
  .control-table td{
    border: 1px solid var(--secondary);
    padding: 10px 12px;
    vertical-align: middle;
  }
  .control-table td.label-cell{
    background: var(--primary);
    color: var(--bg);
    font-family: 'Quattrocento Sans', sans-serif;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.72rem;
    font-weight: 700;
    width: 30%;
    white-space: nowrap;
  }
  .control-table tr:nth-child(even) td.value-cell{
    background: rgba(0,0,0,0.05);
  }
  html.dark .control-table tr:nth-child(even) td.value-cell{
    background: rgba(255,255,255,0.05);
  }

  #speedLabel{
    font-family: 'Quattrocento', serif;
    font-weight: 700;
    color: var(--accent);
  }

  select#voiceSelect{
    width:100%;
    padding: 6px 6px;
    border: 1px solid var(--secondary);
    border-radius: 0;
    background: var(--surface-strong);
    color: var(--primary);
    font-family: 'Quattrocento Sans', sans-serif;
    font-size: 0.85rem;
  }

  input[type="range"]{
    width:100%;
    accent-color: var(--accent);
    height: 26px;
  }

  /* ---------- Buttons ---------- */
  .buttons-row{
    display:flex;
    gap: 10px;
    margin-top: 16px;
  }

  .btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    height: 52px;
    border-radius: 0;
    border: 2px solid var(--primary);
    background: var(--surface-strong);
    color: var(--primary);
    font-family: 'Quattrocento Sans', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-size: 0.78rem;
    cursor: pointer;
    user-select:none;
    box-shadow: 3px 3px 0 var(--secondary);
    transition: transform .08s ease, opacity .15s ease, box-shadow .08s ease;
  }
  .btn:active{ transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--secondary); }
  .btn svg{ width:18px; height:18px; }

  .btn.primary{
    background: var(--accent);
    color: var(--bg);
    border-color: var(--primary);
  }

  .btn:disabled{
    opacity: 0.4;
    cursor: default;
  }
  .btn:disabled:active{ transform:none; box-shadow: 3px 3px 0 var(--secondary); }

  @media (max-width: 380px){
    .btn{ font-size: 0.68rem; height:48px; }
    h1.title{ font-size: 1.7rem; }
    .control-table td.label-cell{ font-size: 0.62rem; letter-spacing: 1px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <div class="masthead-top">
      <span id="editionDate"></span>
      <button id="themeToggle" aria-label="Toggle night edition"></button>
    </div>
    <h1 class="title">The Reading Chronicle</h1>
    <p class="tagline">An Organ of the Spoken Word — Text-to-Speech Edition</p>
  </div>

  <div id="editorWrap" class="panel">
    <div class="section-title">The Manuscript</div>
    <textarea id="inputText" placeholder="Paste up to 1000 words here to have it read aloud…"></textarea>
    <div class="meta-row" id="wordCountRow"><span id="wordCount">0 / 1000 words</span></div>
  </div>

  <div id="readerWrap" class="panel hidden">
    <div id="readerText" aria-live="polite"></div>
  </div>

  <div class="panel controls">
    <div class="section-title">Broadcast Controls</div>

    <table class="control-table">
      <tr>
        <td class="label-cell">Narrator</td>
        <td class="value-cell"><select id="voiceSelect"></select></td>
      </tr>
      <tr>
        <td class="label-cell">Tempo</td>
        <td class="value-cell">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1">
            <span id="speedLabel">1.0x</span>
          </div>
        </td>
      </tr>
    </table>

    <div class="buttons-row">
      <button id="playBtn" class="btn primary">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="playLabel">Play</span>
      </button>
      <button id="pauseBtn" class="btn" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        <span>Pause</span>
      </button>
      <button id="stopBtn" class="btn" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
        <span>Stop</span>
      </button>
    </div>
  </div>

</div>

<script>
(function(){
  const synth = window.speechSynthesis;

  const editorWrap = document.getElementById('editorWrap');
  const readerWrap = document.getElementById('readerWrap');
  const readerText = document.getElementById('readerText');
  const inputText = document.getElementById('inputText');
  const wordCount = document.getElementById('wordCount');
  const wordCountRow = document.getElementById('wordCountRow');
  const voiceSelect = document.getElementById('voiceSelect');
  const speedRange = document.getElementById('speedRange');
  const speedLabel = document.getElementById('speedLabel');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const playLabel = document.getElementById('playLabel');
  const themeToggle = document.getElementById('themeToggle');
  const editionDate = document.getElementById('editionDate');

  let voices = [];
  let wordMeta = [];   // {start, end}
  let wordSpans = [];
  let fullText = '';
  let currentOffset = 0; // char offset of current utterance start relative to fullText
  let currentWordIndex = -1;
  let currentUtterance = null;

  // ---------- Edition date ----------
  editionDate.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';

  // ---------- Theme ----------
  function applyTheme(dark){
    document.documentElement.classList.toggle('dark', dark);
    themeToggle.innerHTML = dark ? SUN_ICON : MOON_ICON;
    localStorage.setItem('tts-dark', dark ? '1' : '0');
  }
  const savedDark = localStorage.getItem('tts-dark');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedDark !== null ? savedDark === '1' : prefersDark);

  themeToggle.addEventListener('click', () => {
    applyTheme(!document.documentElement.classList.contains('dark'));
  });

  // ---------- Word counter ----------
  function updateWordCount(){
    const words = inputText.value.trim().split(/\s+/).filter(Boolean);
    const n = words.length;
    wordCount.textContent = n + ' / 1000 words';
    wordCountRow.classList.toggle('over', n > 1000);
  }
  inputText.addEventListener('input', updateWordCount);
  updateWordCount();

  // ---------- Voices ----------
  function populateVoices(){
    const list = synth.getVoices();
    if(!list.length) return;
    voices = list;
    const prevValue = voiceSelect.value;
    voiceSelect.innerHTML = '';
    voices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = v.name + ' (' + v.lang + ')' + (v.default ? ' — default' : '');
      voiceSelect.appendChild(opt);
    });

    // try restore previous selection
    if(prevValue !== '' && voices[prevValue]){
      voiceSelect.value = prevValue;
    } else {
      const lang = navigator.language || 'en-US';
      let idx = voices.findIndex(v => v.lang === lang);
      if(idx === -1) idx = voices.findIndex(v => v.lang && v.lang.split('-')[0] === lang.split('-')[0]);
      if(idx === -1) idx = voices.findIndex(v => v.default);
      if(idx === -1) idx = 0;
      voiceSelect.value = idx;
    }
  }
  populateVoices();
  if('onvoiceschanged' in synth){
    synth.onvoiceschanged = populateVoices;
  }
  setTimeout(populateVoices, 300);
  setTimeout(populateVoices, 1000);

  // ---------- Speed ----------
  function refreshSpeedLabel(){
    speedLabel.textContent = parseFloat(speedRange.value).toFixed(1) + 'x';
  }
  refreshSpeedLabel();
  speedRange.addEventListener('input', refreshSpeedLabel);
  speedRange.addEventListener('change', () => {
    if(synth.speaking && !synth.paused){
      restartFromWord(currentWordIndex >= 0 ? currentWordIndex : 0);
    }
  });
  voiceSelect.addEventListener('change', () => {
    if(synth.speaking){
      restartFromWord(currentWordIndex >= 0 ? currentWordIndex : 0);
    }
  });

  // ---------- Rendering reader view ----------
  function renderReaderText(text){
    readerText.innerHTML = '';
    wordSpans = [];
    wordMeta = [];
    const re = /\S+/g;
    let lastIndex = 0;
    let m;
    while((m = re.exec(text)) !== null){
      if(m.index > lastIndex){
        readerText.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      }
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = m[0];
      readerText.appendChild(span);
      wordSpans.push(span);
      wordMeta.push({start: m.index, end: m.index + m[0].length});
      lastIndex = m.index + m[0].length;
    }
    if(lastIndex < text.length){
      readerText.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
  }

  function clearHighlight(){
    if(currentWordIndex >= 0 && wordSpans[currentWordIndex]){
      wordSpans[currentWordIndex].classList.remove('active');
    }
    currentWordIndex = -1;
  }

  function highlightAtIndex(absIndex){
    let idx = wordMeta.findIndex(w => absIndex >= w.start && absIndex < w.end);
    if(idx === -1){
      for(let i = wordMeta.length - 1; i >= 0; i--){
        if(wordMeta[i].start <= absIndex){ idx = i; break; }
      }
    }
    if(idx === -1 || idx === currentWordIndex) return;
    if(currentWordIndex >= 0 && wordSpans[currentWordIndex]){
      wordSpans[currentWordIndex].classList.remove('active');
    }
    currentWordIndex = idx;
    const span = wordSpans[idx];
    if(span){
      span.classList.add('active');
      span.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  // ---------- Speech control ----------
  function buildUtterance(text){
    const utt = new SpeechSynthesisUtterance(text);
    const vIdx = voiceSelect.value;
    if(voices[vIdx]) utt.voice = voices[vIdx];
    utt.rate = parseFloat(speedRange.value);
    utt.pitch = 1;
    utt.onboundary = (e) => {
      if(e.name && e.name !== 'word') return;
      highlightAtIndex(currentOffset + e.charIndex);
    };
    utt.onend = () => {
      if(currentUtterance === utt){
        finishSpeech();
      }
    };
    utt.onerror = (e) => {
      if(e.error === 'interrupted' || e.error === 'canceled') return;
      if(currentUtterance === utt){
        finishSpeech();
      }
    };
    return utt;
  }

  function updateControls(){
    const speaking = synth.speaking;
    const paused = synth.paused;
    playBtn.disabled = speaking && !paused;
    pauseBtn.disabled = !speaking || paused;
    stopBtn.disabled = !speaking;
    playLabel.textContent = (speaking && paused) ? 'Resume' : 'Play';
  }

  function startSpeech(){
    const text = inputText.value.trim();
    if(!text) return;
    fullText = text;
    currentOffset = 0;
    clearHighlight();
    renderReaderText(text);
    editorWrap.classList.add('hidden');
    readerWrap.classList.remove('hidden');

    synth.cancel();
    currentUtterance = buildUtterance(text);
    synth.speak(currentUtterance);
    updateControls();
  }

  function restartFromWord(idx){
    if(!fullText) return;
    const meta = wordMeta[idx];
    const startChar = meta ? meta.start : 0;
    currentOffset = startChar;
    const remaining = fullText.slice(startChar);
    synth.cancel();
    currentUtterance = buildUtterance(remaining);
    synth.speak(currentUtterance);
    updateControls();
  }

  function finishSpeech(){
    clearHighlight();
    readerWrap.classList.add('hidden');
    editorWrap.classList.remove('hidden');
    currentUtterance = null;
    updateControls();
  }

  playBtn.addEventListener('click', () => {
    if(synth.paused){
      synth.resume();
      updateControls();
    } else if(!synth.speaking){
      startSpeech();
    }
  });

  pauseBtn.addEventListener('click', () => {
    if(synth.speaking && !synth.paused){
      synth.pause();
      updateControls();
    }
  });

  stopBtn.addEventListener('click', () => {
    synth.cancel();
    finishSpeech();
  });

  setInterval(updateControls, 400);
  updateControls();

  window.addEventListener('beforeunload', () => { synth.cancel(); });
})();
</script>
</body>
</html>
